id: document_camera
label: Document camera for calls
goal: Show paper, a book or a small object on a video call, from a phone or a webcam you already own.
result: a camera held above the desk, its picture shared in a call from the laptop
effort: low
skills: [basic computer setup]
opens_devices: false
typical_cost: {low: 0, high: 30, currency: USD}
requirements:
  - key: camera
    label: A phone with a camera, or a USB webcam
    kind: item
    item_types: [phone, webcam, camera]
    blocking: true
  - key: laptop
    label: A laptop that joins the call
    kind: item
    item_types: [laptop, notebook]
    blocking: true
  - key: stand
    label: A stand or an arm that holds the camera above the desk
    kind: item
    item_types: [stand, arm, tripod, mount]
    blocking: false
    profile: generic_item
steps:
  - Mount the camera above the desk pointing down; a shelf, a stack of books or a cheap arm works.
  - For a phone, open its camera as a webcam in the call app, or use the maker's continuity feature if both devices support it.
  - Check the picture in the call before it starts; add a desk lamp if the page is dark.
safety: []
sources:
  - the call app's help on choosing a camera
