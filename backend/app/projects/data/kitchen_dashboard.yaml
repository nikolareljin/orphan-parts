id: kitchen_dashboard
label: Kitchen home-automation dashboard
goal: A screen on the kitchen wall that shows the room's temperature and humidity, wakes when someone walks up, hears the extractor hood and switches a light or a fan, from an old laptop or monitor and an Arduino-type board with sensor modules.
result: a wall screen running a home automation dashboard, fed by a board with a temperature and humidity sensor, a distance sensor, a sound sensor and a relay
effort: high
skills: [basic computer setup, basic electronics, basic coding, networking]
opens_devices: false
typical_cost: {low: 10, high: 60, currency: USD}
requirements:
  - key: screen
    label: A monitor, a tablet or a laptop screen for the wall
    kind: item
    item_types: [monitor, display, screen, tablet, laptop, notebook]
    blocking: true
  - key: computer
    label: A laptop or a small computer that runs the dashboard
    kind: item
    item_types: [laptop, notebook, mini pc, desktop, tablet]
    blocking: true
  - key: controller
    label: A microcontroller board that reads the sensors and drives the relay
    kind: item
    item_types: [microcontroller, microcontroller board, development board, arduino]
    blocking: true
  - key: climate
    label: A temperature and humidity sensor
    kind: item
    item_types: [humidity sensor, temperature sensor, dht11, dht22, humidity sensor module, temperature sensor module]
    blocking: false
  - key: presence
    label: A distance sensor that wakes the screen when someone walks up
    kind: item
    item_types: [ultrasonic sensor, distance sensor, motion sensor, obstacle sensor, distance sensor module, motion sensor module, obstacle sensor module]
    blocking: false
  - key: sound
    label: A sound sensor that hears the extractor hood or the kettle
    kind: item
    item_types: [sound sensor, microphone, sound sensor module]
    blocking: false
  - key: switch
    label: A relay that switches a light or a fan
    kind: item
    item_types: [relay, relay module]
    blocking: false
steps:
  - Run a home automation dashboard on the laptop; show it full screen on the monitor on the wall.
  - Wire the sensors to the board and send their readings to the laptop over USB serial; show them as cards on the dashboard.
  - Turn the screen on when the distance sensor sees someone within a meter; off again after a minute.
  - Drive a low-voltage light or fan from the relay; leave mains wiring to an electrician.
safety:
  - The relay module is for low voltage here; mains switching needs an enclosed, rated device and an electrician.
  - Keep the boards and the laptop away from the sink and the stove's heat and steam.
sources:
  - the home automation system's guide to serial sensors
  - each sensor module's example sketch
