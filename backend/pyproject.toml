[project]
name = "orphan-parts"
version = "0.1.0"
description = "Identify spare parts, draft Marketplace listings, verify matches with Meta's Muse models"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Nik Reljin", email = "nikola.reljin@gmail.com" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "python-multipart>=0.0.9,<1",
  "meta-sam-parser>=0.1,<0.2",
  "pyyaml>=6,<7",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["profiles/data/*.yaml", "projects/data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:app"]

[tool.coverage.run]
branch = true
source = ["app"]
