<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a28"/><stop offset="1" stop-color="#0a0e15"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#cardBg)"/>
  <image x="96" y="72" width="96" height="96" preserveAspectRatio="xMidYMid meet" href="logo.svg" xlink:href="logo.svg"/>
  <text x="220" y="135" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="600" fill="#f8fafc" text-anchor="start">Meta models in the app</text>
  <rect x="220" y="160" width="120" height="6" rx="3" fill="#00f5d4"/>
  <rect x="220" y="222" width="1480" height="96" rx="18" fill="#1b2436" stroke="#2d384d" stroke-width="2"/>
  <rect x="220" y="222" width="8" height="96" rx="4" fill="#00f5d4"/>
  <text x="270" y="286" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">Muse Spark</text>
  <text x="770" y="282" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1" text-anchor="start">reads labels and listings, searches the web for parts, proposes projects</text>
  <rect x="220" y="342" width="1480" height="96" rx="18" fill="#1b2436" stroke="#2d384d" stroke-width="2"/>
  <rect x="220" y="342" width="8" height="96" rx="4" fill="#00f5d4"/>
  <text x="270" y="406" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">SAM 3.1</text>
  <text x="770" y="402" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1" text-anchor="start">finds the item, its label and its connector in a photo</text>
  <rect x="220" y="462" width="1480" height="96" rx="18" fill="#1b2436" stroke="#2d384d" stroke-width="2"/>
  <rect x="220" y="462" width="8" height="96" rx="4" fill="#00f5d4"/>
  <text x="270" y="526" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">Muse Voice Transcribe</text>
  <text x="770" y="522" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1" text-anchor="start">keeps spoken notes as the owner's words</text>
  <rect x="220" y="582" width="1480" height="96" rx="18" fill="#1b2436" stroke="#2d384d" stroke-width="2"/>
  <rect x="220" y="582" width="8" height="96" rx="4" fill="#00f5d4"/>
  <text x="270" y="646" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">Muse Image</text>
  <text x="770" y="642" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1" text-anchor="start">draws how a finished project could look, marked as drawn</text>
  <rect x="220" y="702" width="1480" height="96" rx="18" fill="#1b2436" stroke="#2d384d" stroke-width="2"/>
  <rect x="220" y="702" width="8" height="96" rx="4" fill="#cbd5e1"/>
  <text x="270" y="766" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">The rules</text>
  <text x="770" y="762" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1" text-anchor="start">decide fits, prices and what is kept; the model only proposes</text>
  <text x="960" y="1010" font-family="'Noto Sans', 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" text-anchor="middle">Marketplace by handoff only: the search and the create page open for you; nothing is posted or fetched.</text>
</svg>
