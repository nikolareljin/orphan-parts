site_name: Orphan Parts Lens
site_description: Scan what you own, decide what it can become, find the missing piece on Marketplace or prepare what you let go. Every answer with its evidence, on Meta's Muse models.
site_url: https://nikolareljin.github.io/orphan-parts/
repo_url: https://github.com/nikolareljin/orphan-parts
repo_name: nikolareljin/orphan-parts
edit_uri: edit/main/docs/
copyright: MIT License · <a href="https://nikolareljin.github.io/orphan-parts/about/">About the author</a>

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: light mode

extra_css:
  - assets/extra.css

plugins:
  - search
  - swagger-ui-tag
  - git-revision-date-localized:
      enabled: !ENV [DOCS_GIT_DATES, true]
      fallback_to_build_date: true
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

