name: release

# Tag a commit on main with a bare SemVer (0.2.0) to publish that version:
# images go to GHCR, and a GitHub release is created with the matching changelog section.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag must match the version in the manifests
        run: |
          tag="${GITHUB_REF_NAME}"
          py="$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          js="$(node -p "require('./frontend/package.json').version")"
          [ "$tag" = "$py" ] && [ "$tag" = "$js" ] || { echo "tag $tag != pyproject $py / package.json $js"; exit 1; }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push images
        run: |
          TAG="${GITHUB_REF_NAME}" docker compose -f docker-compose.yml -f docker-compose.prod.yml build
          for svc in backend frontend; do
            docker tag "$IMAGE_PREFIX/$svc:${GITHUB_REF_NAME}" "$IMAGE_PREFIX/$svc:latest"
            docker push "$IMAGE_PREFIX/$svc:${GITHUB_REF_NAME}"
            docker push "$IMAGE_PREFIX/$svc:latest"
          done

      - name: smoke test the published backend image
        run: |
          docker run -d --rm --name opl -e OPL_FAKE_API=1 -p 8000:8000 "$IMAGE_PREFIX/backend:${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/readyz
          docker stop opl

      - name: release notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME}" '/^## /{p = index($0, "## " v) == 1} p' CHANGELOG.md > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
