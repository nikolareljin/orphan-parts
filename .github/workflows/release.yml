name: release

# Publishes one version: images go to GHCR, and a GitHub release is created with the matching
# changelog section. Two ways in: the tag-release workflow calls it after tagging the merge of
# a release/x.y.z pull request, or a bare SemVer tag (0.2.0) is pushed by hand. Nothing here
# runs for pull requests or merges on their own.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        description: the tag to publish, already on the repository
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # the notes list the pull requests since the previous release: the history is needed
          fetch-depth: 0

      - name: tag must match VERSION and the version in every manifest
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          py="$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          init="$(grep -m1 '^__version__' backend/app/__init__.py | cut -d'"' -f2)"
          js="$(node -p "require('./frontend/package.json').version")"
          if [ "$TAG" != "$file" ] || [ "$TAG" != "$py" ] || [ "$TAG" != "$init" ] || [ "$TAG" != "$js" ]; then
            echo "tag $TAG; VERSION $file; pyproject $py; app/__init__.py $init; package.json $js"
            exit 1
          fi

      - name: release notes, from the changelog section, the pull requests, the compare link and the images
        run: |
          git fetch --tags --quiet origin
          bash scripts/release-notes.sh "$TAG" > notes.md
          cat notes.md

      - name: sign in to GHCR with the job token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build the production images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend

      - name: smoke test the backend image before anything is pushed
        run: |
          docker run -d --name opl -e OPL_FAKE_API=1 -e DATA_DIR=/data -p 8000:8000 "$IMAGE_PREFIX/backend:$TAG"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          ready="$(curl -fsS http://localhost:8000/readyz || true)"
          echo "readyz: $ready"
          docker logs opl 2>&1 | tail -20
          docker rm -f opl >/dev/null
          [ "$ok" = 1 ] || { echo "healthz never answered"; exit 1; }
          echo "$ready" | grep -q '"status":"ok"' || { echo "readyz is not ok"; exit 1; }

      - name: push the images
        run: |
          for svc in backend frontend; do
            docker tag "$IMAGE_PREFIX/$svc:$TAG" "$IMAGE_PREFIX/$svc:latest"
            docker push "$IMAGE_PREFIX/$svc:$TAG"
            docker push "$IMAGE_PREFIX/$svc:latest"
          done

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md

  # The Android app, once it is in the tree: a release APK attached to the release. The job
  # checks out the tag and does nothing more until android/gradlew exists (a job-level test
  # of the tree is not possible, so the steps test it); the store upload is a later step.
  android:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: is there an app
        id: app
        run: |
          if [ -f android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no app in this tree; nothing to build"
          fi
      - name: build the release APK
        if: steps.app.outputs.present == 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: bash scripts/deploy.sh android --version "$TAG"
      - name: attach the APK to the release
        if: steps.app.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$(find android -path '*/outputs/apk/release/*.apk' | head -1)"
          cp "$apk" "orphan-parts-$TAG.apk"
          gh release upload "$TAG" "orphan-parts-$TAG.apk" --clobber

  # The host, once there is one: the repository variable DEPLOY_ENABLED set to true turns this
  # on, the secrets DEPLOY_HOST (user@host), DEPLOY_PATH and DEPLOY_SSH_KEY say where and how.
  # The same script a person runs with ./dev deploy, so there is one way to do it.
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: put the release on the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          DEPLOY_SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            bash scripts/deploy.sh web --version "$TAG"
