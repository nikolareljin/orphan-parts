name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: lint and type-check the live check
        run: ruff check ../livecheck && ruff format --check ../livecheck && mypy ../livecheck
        env:
          PYTHONPATH: ..
      - run: pytest
        env:
          OPL_FAKE_API: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the live check's gitleaks test runs here rather than skipping
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # the release's published checksum for gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bin="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$archive" "$base/$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" gitleaks && rm -f "$archive"
          echo "$bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/run.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./dev e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # page dates come from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docker/docs/requirements.txt
            backend/pyproject.toml
      - run: pip install -r docker/docs/requirements.txt -e backend
      - name: export OpenAPI document
        run: python -m app.openapi_export > ../docs/reference/openapi.json
        working-directory: backend
        env:
          OPL_FAKE_API: "1"
      - run: mkdocs build --strict
