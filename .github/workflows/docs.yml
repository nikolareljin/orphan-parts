name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "docker/docs/**", "backend/app/**", "CHANGELOG.md", "LICENSE", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # page dates come from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docker/docs/requirements.txt
            backend/pyproject.toml
      - run: pip install -r docker/docs/requirements.txt -e backend
      - name: export OpenAPI document
        run: python -m app.openapi_export > ../docs/reference/openapi.json
        working-directory: backend
        env:
          OPL_FAKE_API: "1"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
