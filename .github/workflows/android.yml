name: android

# The app's checks, only when the app or its script changed: the unit tests on the JVM and the
# debug APK. The runner has a JDK and the Android SDK; nothing is installed.
on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/android.sh"
      - "VERSION"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/android.sh"
      - "VERSION"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests and the debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          bash scripts/android.sh test
          bash scripts/android.sh build
