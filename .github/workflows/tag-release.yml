name: tag-release

# A pull request from a release/x.y.z branch merged into main becomes the tag x.y.z on the
# merge commit, and the release workflow publishes it. The version has to be x.y.z, match
# every manifest and have its changelog section, and must not be tagged yet: an existing tag
# is never moved. Nothing runs for any other branch, or for a pull request closed unmerged.
#
# The tag is pushed with the job token, so it does not fire the release workflow's tag trigger
# by itself; the publish job calls that workflow directly. The repository ruleset that limits
# tag creation has to let GitHub Actions through, otherwise the push is refused and the tag
# is pushed by hand instead.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: the branch names a version that matches every manifest and is not tagged yet
        id: check
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch --tags --quiet origin
          tag="$(bash scripts/release-tag.sh "$BRANCH")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: tag the merge commit
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  publish:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      packages: write
