# Development stack: ./dev up
# Source directories are bind-mounted; the backend reloads on change and Vite serves with HMR.
name: orphan-parts

services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OPL_FAKE_API: ${OPL_FAKE_API:-0}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_REQUESTS_PER_MINUTE: ${DEMO_REQUESTS_PER_MINUTE:-120}
      DEMO_VISITOR_CALLS_PER_HOUR: ${DEMO_VISITOR_CALLS_PER_HOUR:-20}
      DEMO_DAILY_CALLS: ${DEMO_DAILY_CALLS:-300}
    volumes:
      - ./backend:/app
      - app-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

  docs:
    build: ./docker/docs
    profiles: ["docs"]
    working_dir: /src
    command: serve --dev-addr 0.0.0.0:8001
    # runs as the host user so site/ is not owned by root
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      DOCS_GIT_DATES: ${DOCS_GIT_DATES:-true}
    volumes:
      - .:/src
    ports:
      - "${DOCS_PORT:-8001}:8001"

  # Browser checks: ./dev e2e. Shares the frontend container's network, so localhost:5173 is Vite.
  e2e:
    # the tag must match the @playwright/test version in e2e/package.json
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"
    # runs as the host user so node_modules/ and test-results/ under e2e/ are not owned by root
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      CI: "1"
      E2E_BASE_URL: http://localhost:5173
      E2E_VIDEO: ${E2E_VIDEO:-retain-on-failure}
      E2E_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
    volumes:
      - ./e2e:/e2e
    network_mode: "service:frontend"
    depends_on:
      - frontend

  # Open-weight path: Muse Glimmer served locally. Started only with ./dev up --with-glimmer.
  glimmer:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["openweight"]
    command: >
      --model /models/${GLIMMER_GGUF:-muse-glimmer.gguf}
      --host 0.0.0.0 --port 8080 --ctx-size 8192
    volumes:
      - ${GLIMMER_MODELS_DIR:-./data/models}:/models:ro
    ports:
      - "${GLIMMER_PORT:-8080}:8080"

volumes:
  app-data:
  frontend-modules:
