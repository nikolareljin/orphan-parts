propose:
  count: 3
  pictures: true
  packs: true
  preferences:
    interests: a quiet desk for homework; a second screen for the kitchen; home automation; a smart mirror in the hall; a home server for the photos; a custom NAS from the spare desktop boards and drives; a gaming coffee table with joysticks; a smart desk calendar; a kitchen home-automation dashboard; a weather station; a garage parking helper; retro games on the TV
    effort: medium
    skills: [basic computer setup, {skill: electronics and soldering, level: some}, {skill: software, level: confident}]
    budget: 400
    currency: USD
  note: builds around the screens (a smart mirror for the hall, a homework desk) and a home automation server
  # two more calls, each steered by the owner's note, then every kept project drawn as built
  rounds:
    - count: 4
      note: builds from the spare desktop boards, memory, drives and M.2 adapters (a custom NAS for the family's photos, a home server), and games in a coffee table or on the TV with the joystick module as the controls
    - count: 4
      note: builds from the UNO board and the sensor modules (a smart desk calendar with the clock module and the buzzer, a kitchen dashboard with the sensors and the relay, a weather station, a garage parking helper)
  # the coffee table's proposal left its controls open: the owner puts the joystick module there
  fill:
    - template: arcade_table
      requirement: controls
      item: joystick
      why: the first control; a second joystick and buttons still to find
  # four builds selected, each with its build pack: what they still need becomes a search with
  # its Marketplace links, and each is drawn twice more, up close and from above
  select: [custom_nas, arcade_table, smart_calendar, home_automation_server]
  plan_missing: true
  views:
    - as a close-up of how the parts fit together
    - from above, as it is used
  corrections:
    "smart_mirror": "Add: small 18-inch 4:3 monitor about 46cm diagonal behind center of hall two-way mirror, time/weather/calendar glow only in small central area, mirror much larger than display, not a large full-surface TV display."
    "custom_nas / from above, as it is used": "Top-down ATX NAS case with full ATX motherboard, single desktop memory stick fitted in DIMM slot, dual-M.2 PCIe adapter card fitted in PCIe slot, 3.5-inch HDD and 2.5-inch SATA SSD mounted and cabled to board, ATX PSU; do not leave RAM and PCIe slots empty.; soft daylight, a clean uncluttered composition, the parts side by side at real scale"
    "home_server": "an opened laptop about 35 cm wide on a wooden desk, wired to a router with antennas and to one bare 2.5 inch hard drive by a single cable; the memory is inside the laptop and not shown; no second drive, no extra box, no words or logos, not a desktop tower"
    "arcade_table / from above, as it is used": "seen from above: a wooden coffee table with a glass top; under the glass a 24 inch widescreen monitor lies flat, about 53 x 30 cm, much wider than the opened laptop that runs it at one end; two joysticks and buttons along the edge; no words or logos"
    "home_automation_server": "Add: a standard 15-inch laptop on a wooden table as always-on home server with icons-only dashboard, laptop memory module beside it and wired network cable plugged in, with absolutely no legible text, logos or brand names anywhere, not a TV or desktop.; seen at eye level from across the room, every part at its true size against the furniture"
    "home_automation_server / as a close-up of how the parts fit together": "soft daylight, a clean uncluttered composition, the parts side by side at real scale"
    "home_automation_server / from above, as it is used": "only the parts listed, nothing extra on the table, every part at its true size"
    "custom_nas / as a close-up of how the parts fit together": "Add line: close-up inside open ATX tower with full-size ATX motherboard vertical, one desktop memory stick seated in DIMM slot beside CPU cooler, empty dual-M.2 PCIe adapter without M.2 SSDs, one 3.5-inch hard drive and one 2.5-inch SATA SSD cabled below; do not add extra M.2 drives, do not omit memory.; only the parts listed, nothing extra on the table, every part at its true size"
