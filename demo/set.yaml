# The demo set: what the walkthrough is made of. Photos and notes are files beside this one,
# written by `./dev demo-scrub <raw dir>` (re-encoded, no metadata). `./dev record-fixtures`
# runs the set once with a key and keeps every model answer; `./dev demo` replays it.
# A photo named here that is not present is skipped with a note, so the set loads either way.
# An item's `expect:` block is what `./dev eval` scores the load against: values the reading
# should give (as printed on the label in the photos), how many kept proposals should use it.
# The photos are the owner's own, with serial numbers, MAC addresses and keys masked before
# they were scrubbed; the recordings under backend/tests/fixtures/api are of these files.
title: a drawer of idle things
currency: USD
country: US

items:
  # screens: two Dell monitors and an old Sun one
  - key: monitor_u2419h
    name: Dell U2419H monitor, 24 inch
    item_type: monitor
    intent: build
    photos: [photos/dell-u2419h-label.jpg]
    expect:
      fields:
        brand: Dell
        model_number: U2419H
      proposals_min: 1
  - key: monitor_1800fp
    name: Dell 1800FP monitor, 18 inch
    item_type: monitor
    intent: build
    photos: [photos/dell-1800fp-label.jpg]
    expect:
      fields:
        brand: Dell
        model_number: 1800FP
      proposals_min: 1
  - key: monitor_sun
    name: Sun flat panel monitor
    item_type: monitor
    intent: sell
    photos: [photos/sun-monitor-label.jpg, photos/sun-monitor-back.jpg]
    draft: sell
    price: true
    expect:
      fields:
        brand: Sun Microsystems
        part_number: 365-1429-01

  # two ThinkPads and a spare laptop board
  - key: laptop_t510
    name: ThinkPad T510
    item_type: laptop
    intent: build
    photos: [photos/thinkpad-t510-inside.jpg, photos/thinkpad-t510-label.jpg]
    condition: opened; the keyboard and the palm rest are off
    expect:
      fields:
        brand: Lenovo
  - key: laptop_9461
    name: Older ThinkPad, type 9461
    item_type: laptop
    intent: give
    photos: [photos/thinkpad-9461-bottom.jpg, photos/thinkpad-9461-labels.jpg]
    holds_data: true
    draft: give
    expect:
      fields:
        brand: Lenovo
        model_number: 9461-54G
  - key: laptop_board
    name: Laptop motherboard, no processor
    item_type: motherboard
    intent: sell
    photos: [photos/laptop-board-top.jpg, photos/laptop-board-side.jpg]
    condition: the processor socket is empty
    draft: sell
    asking_price: "25"

  # desktop parts from older machines
  - key: gpu_9800gt
    name: EVGA GeForce 9800 GT graphics card
    item_type: graphics card
    intent: sell
    photos: [photos/evga-9800gt-front.jpg, photos/evga-9800gt-back.jpg]
    condition: dust on the fan
    draft: sell
    price: true
    expect:
      fields:
        brand: EVGA
        model_number: e-GeForce 9800 GT
  - key: cpu_slot1
    name: Intel slot 1 processor with its fan
    item_type: processor
    intent: give
    photos: [photos/intel-slot-cpu.jpg, photos/intel-slot-cpu-fan.jpg]
    draft: give
    expect:
      fields:
        brand: Intel

  # the home network
  - key: powerline
    name: TP-Link TL-PA2010 powerline adapter
    item_type: powerline adapter
    intent: build
    photos: [photos/tplink-pa2010.jpg, photos/tplink-pa2010-label.jpg]
    condition: still in its plastic wrap; one unit, its twin is missing
    expect:
      fields:
        brand: TP-Link
        model_number: TL-PA2010

  # the frappé maker whose agitator wore out: measured against a ruler, looking for a rod
  # of the same size, all metal
  - key: frappe_agitator
    name: Frappé maker agitator, worn
    item_type: blender agitator
    profile: blender_agitator
    intent: keep
    photos: [photos/agitator-ruler.jpg, photos/agitator-head.jpg, photos/agitator-coupling.jpg]
    faults: the plastic hub where the disc meets the rod is worn; the disc wobbles and no longer spins true
    condition: the base runs; the rod no longer mixes
    fields:
      rod_diameter: "4"
      tab_span: "9"
      tab_width: "2.5"
      tab_length: "8"
      rod_length: "150"
      # the material wanted in a replacement (metal or plastic); the worn hub's plastic is in
      # the faults
      material: "metal"

searches:
  - key: metal_agitator
    need: frappe_agitator
    title: all-metal agitator rod for the frappé maker, 4 mm rod, two tabs 9 mm across
    max_price: 20
    listings:
      - text: "@listings/L1.txt"
        asking_price: "12"
      - text: "@listings/L2.txt"
        asking_price: "6"
      - text: "@listings/L3.txt"
        asking_price: "10"
      - text: "@listings/L4.txt"
        asking_price: "5"

propose:
  count: 3
  preferences:
    interests: a quiet desk for homework; a second screen for the kitchen; home automation; a smart mirror in the hall; a home server for the photos
    effort: low
    skills: [basic computer setup]
    budget: 50
    currency: USD
