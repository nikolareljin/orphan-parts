    "arcade_table / as a close-up of how the parts fit together": "Show a 24-inch monitor laid face-up inside a wooden coffee-table box under a glass top, an opened laptop tucked alongside connected by cables, only one arcade joystick controller with ball-top and buttons, not two joysticks and not a TV."
