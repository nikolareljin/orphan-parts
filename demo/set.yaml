  # the frappé maker whose agitator wore out, looking for a rod of the same size, all metal;
  # its rod diameter measured on the photo with the tape measure beside it, nothing else sized
  - key: frappe_agitator
    name: Frappé maker agitator, worn
    item_type: blender agitator
    profile: blender_agitator
    intent: keep
    photos: [photos/agitator-ruler.jpg, photos/agitator-head.jpg, photos/agitator-coupling.jpg]
    faults: the plastic hub where the disc meets the rod is worn; the disc wobbles and no longer spins true
    condition: the base runs; the rod no longer mixes
    # the rod's diameter as Measure a feature computes it from these marks (pixels of the
    # 739 x 1600 photo): the tape measure's 1 and 5 inch marks as the known length (101.6 mm),
    # then the rod's two edges; the tabs and the rod's length were never measured, so they
    # stay unknown and become questions for a seller
    measurements:
      - photo: photos/agitator-ruler.jpg
        feature: rod_diameter
        reference:
          kind: two_point
          points: [{x: 228, y: 405}, {x: 160, y: 1262}]
          length_mm: 101.6
        points: [{x: 422, y: 700}, {x: 462, y: 700}]
        straight_on: true
    fields:
      # the material wanted in a replacement (metal or plastic); the worn hub's plastic is in
      # the faults
      material: "metal"
    decide: true
    decision: keep_fix
    # the rod alone carries no model number, so the app asks which device it came from; the
    # answer: the drink mixer it came off, read from its photos (the label under its base, its
    # badge, the whole mixer and its side with the rod fitted), nothing typed: the recorded
    # reading gives HAMILTON BEACH 729, accepted as the device's model.
    parent_photos: [photos/hamilton-729-label.jpg, photos/hamilton-729-badge.jpg, photos/hamilton-729-mixer.jpg, photos/hamilton-729-side.jpg]

