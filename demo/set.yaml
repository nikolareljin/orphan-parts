# The demo set: what the walkthrough is made of. Photos and notes are files beside this one,
# written by `./dev demo-scrub <raw dir>` (re-encoded, no metadata). `./dev record-fixtures`
# runs the set once with a key and keeps every model answer; `./dev demo` replays it.
# A photo named here that is not present is skipped with a note, so the set loads either way.
# An item's `expect:` block is what `./dev eval` scores the load against: values the reading
# should give (as printed on the label in the photos), how many kept proposals should use it.
# The photos are the owner's own, with serial numbers, MAC addresses and keys masked before
# they were scrubbed; the recordings under backend/tests/fixtures/api are of these files.
# An item's `picture:` asks Muse Image for a drawing of it as that use (a template id or a few
# words) once its drafts are written; fixture mode shows the drawing only once a record run
# has kept it, and says "not recorded yet" until then.
# A part's `parent_photos:` are photos of the device it came from, read once as a label (only a
# recording of them answers in fixture mode); `parent_device:` is the owner's words about it and
# `parent_device_model:` the model as its label states, saved as typed until that read is recorded.
# What the owner asked under Decide is kept the same way, so the visitor reads the answers
# rather than asking again: `decide: true` writes the three cards (from the items loaded
# before it), `ideas: true` asks what it is good for, `reuse_picture: true` draws the first
# reuse card, `decision:` records the plan chosen (keep_fix, keep_spare, keep_build, sell,
# give, not_worth; `decision_note:` the owner's words with it, never shown to the visitor).
# A search's `plan: true` writes its plan (phrasings, Marketplace links, pattern), and
# `propose: pictures: true` draws each kept project and `packs: true` selects the kept
# projects their items allow and writes their build packs (rules, no model). In fixture mode each of these is
# answered only by the recording of that very request; a new item's are recorded once with
# ./dev record-fixtures (it replays what is kept and buys only what is missing).
